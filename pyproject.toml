[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loanlab-test-agent"
version = "0.2.0"
description = "Controlled tool-calling Agent for loan withdrawal testing"
requires-python = ">=3.12"
dependencies = []
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
loanlab = "loanlab.server:main"

[tool.setuptools.packages.find]
include = ["loanlab*"]

[tool.setuptools.package-data]
loanlab = ["web/*", "*.json"]
